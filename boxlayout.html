<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoxLayout</title>
    <style>
#box1{
    width: 200px;
    height: 200px;
    padding: 20px;
    border: 5px solid rgb(157, 72, 170);
    background-color: rgb(184, 157, 210);
    margin: 10px;
    box-sizing: content-box;
    border-radius: 10px;
    text-decoration: underline rgb(72, 76, 121);
    color: rgb(15, 80, 145);
    text-shadow: 0.2px 0.3px;
    
}
#box1:hover{
    background-color: lavenderblush;
    text-align: center;
    border-radius: 5px solid rgb(138, 138, 247);

}
#box2{
    width: 200px;
    height: 200px;
    padding: 20px;
    background-color: pink;
    border: 5px solid rgb(252, 143, 161);
    margin: 10px;
    box-sizing: border-box;
    border-radius: 10px;
    border-top-style: solid;
    backdrop-filter: blur(30px);
    text-decoration: underline ;
}
#box2:hover{
    background-color: rgb(246, 140, 95);
    text-align: center;
}


.fruits{
    list-style-type: lower-roman;
    
}
    </style>
</head>
<body>
    <div id="box1">
        Content box
    </div>
    <br>
    <div id="box2">
        border box
    </div>
    <ol class="fruits">
        <li>Harry Potter</li>
        <li>Doremon</li>
        <li>shinchan</li>
    </ol>
</body>
</html>
